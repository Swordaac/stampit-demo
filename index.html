<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StampIt Demo</title>
<meta name="description" content="Interactive demo of StampIt — digital stamp cards that bring customers back to local stores.">
<style>
:root{
  --page:#f3eee7; --ink:#1f1a17; --muted:#6f655d; --line:#e7ded3; --card:#fff;
  --app:#faf7f3; --brand:#e4572e; --brand-soft:#fde9e2; --danger:#c0392b; --ok:#2e7d4f;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- Demo bar (outside the app) ---------- */
.demobar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding:12px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.db-brand{display:flex;align-items:center;gap:10px}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800}
.db-tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.db-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:#efe8df;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.db-field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.db-field select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.db-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}
.db-btn.ghost{background:none}
.hint{max-width:860px;margin:18px auto 0;padding:0 16px;text-align:center;color:var(--muted);font-size:14px}
.hint b{color:var(--ink)}
.demo-fab{display:none}

/* ---------- Stage & phone frame ---------- */
.stage{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:40px;padding:20px 16px 48px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:13px;color:var(--muted)}
.cap b{color:var(--ink)}
.phone{position:relative;width:375px;height:min(800px,max(620px,calc(100vh - 150px)));border-radius:52px;background:#141210;padding:12px;box-shadow:0 30px 60px -20px rgba(60,40,20,.35),0 0 0 1px #2b2622 inset}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--app);display:flex;flex-direction:column}
.overlay{position:absolute;inset:12px;border-radius:40px;overflow:hidden;pointer-events:none;z-index:40}
.statusbar{flex:none;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:14px;font-weight:600;position:relative}
.statusbar .notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#141210}
.statusbar .sig{letter-spacing:1px;font-size:12px}

/* ---------- App chrome ---------- */
.app-head{flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 12px}
.badge-ava{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.ah-title{font-weight:700;font-size:17px;line-height:1.2}
.ah-sub{font-size:12.5px;color:var(--muted)}
.app-head .grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#efe8df;color:var(--muted)}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:4px 16px 24px}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 22px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#9a8f86;padding:6px 0}
.tabbar button.on{color:var(--accent)}
.tb-ic{position:relative;display:inline-flex}
.tbadge{position:absolute;top:-4px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-sizing:content-box}
.list.req{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.req-row{border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{border:0;background:none;padding:8px 0 0;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
h3.sec span{text-transform:none;letter-spacing:0;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel+.panel{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#f0d3cf;background:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted)}
.benefit{background:var(--accent-soft);border-color:transparent}
.benefit b{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.bars div{flex:1;background:var(--accent);opacity:.35;border-radius:5px 5px 2px 2px;min-height:4px;position:relative}
.bars div:last-child{opacity:1}
.bars-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
button.row:active{background:#faf6f1}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.risk{background:#fdecea;color:var(--danger)}
.tag.gift{background:#e7f4ec;color:var(--ok)}
.tag.off{background:#efe8df;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin-bottom:10px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:36px}

/* stamp cards */
.scard{--c:#9c5b2e;position:relative;background:var(--c);color:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px -10px var(--c);border:0;width:100%;text-align:left;display:block}
.scard+.scard{margin-top:12px}
.sc-top{display:flex;align-items:center;gap:10px}
.sc-emoji{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:19px}
.sc-store{font-size:12px;opacity:.85}
.sc-name{font-weight:700;font-size:16px}
.sc-count{margin-left:auto;font-weight:700;font-size:15px;background:rgba(0,0,0,.18);border-radius:999px;padding:3px 10px}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.dot{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;font-size:16px}
.dot.on{border:0;background:#fff}
.dot.goal{border-style:solid}
.dot.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.sc-foot{font-size:12.5px;opacity:.92}
.paused{filter:grayscale(.8);opacity:.75}
.card-actions{display:flex;gap:8px;margin-top:8px;margin-bottom:14px}
.card-actions .btn{flex:1}
.card-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px;padding:0 2px}

/* scanner */
.viewfinder{position:relative;height:230px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#3a332e,#151210);overflow:hidden;display:grid;place-items:center;color:#d6cdc4;font-size:13px}
.vf-box{position:absolute;width:150px;height:150px;left:50%;top:50%;transform:translate(-50%,-55%)}
.vf-box i{position:absolute;width:28px;height:28px;border:3px solid #fff}
.vf-box i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.vf-box i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf-box i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.vf-box i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf-line{position:absolute;left:8px;right:8px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
.vf-text{position:absolute;bottom:16px;left:0;right:0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.pchip .ava{width:28px;height:28px;font-size:11px}

/* sheets */
.sheet-wrap{position:absolute;inset:0;background:rgba(20,15,10,.38);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px 28px}
.sheet.anim{animation:up .24s ease-out}
.sheet-wrap.anim{animation:fade .2s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#ddd4ca;margin:4px auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:19px}
.sh-head .grow{flex:1;min-width:0}
.x{border:0;background:#f1ebe4;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.prog-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.prog-row .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;border-radius:5px;background:#efe8df;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:0}
.field input:focus,.field select:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.sheet .actions{display:flex;gap:10px;margin-top:6px}
.sheet .actions .btn{flex:1}
.qr{display:block;margin:6px auto 12px;width:200px;height:200px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px}
.center{text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;font-weight:600}
.store-tile{display:flex;gap:12px;align-items:center}
.store-tile+.store-tile{margin-top:10px}

/* overlay: banners, toasts, confetti */
.banner{position:absolute;left:10px;right:10px;top:50px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.3);animation:drop .35s ease-out;transition:opacity .3s,transform .3s}
.banner.out{opacity:0;transform:translateY(-20px)}
.banner .badge-ava{width:34px;height:34px;font-size:17px;border-radius:9px}
.banner .t{font-weight:700;font-size:13.5px}
.banner .s{font-size:13px;color:var(--muted)}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#1f1a17;color:#fff;padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:500;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;animation:fade .2s;transition:opacity .3s}
.toast.out{opacity:0}
.confetti{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(820px) rotate(720deg);opacity:.6}}

/* ---------- Phone-sized screens: app fills the screen ---------- */
@media (max-width:720px){
  .demobar{position:fixed;inset:0 0 auto 0;display:none;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .demobar.open{display:flex}
  .seg button[data-mode="both"]{display:none}
  .hint{display:none}
  .stage{padding:0;gap:0}
  .col{width:100%}
  .cap{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;background:none;box-shadow:none}
  .screen{border-radius:0}
  .overlay{inset:0;border-radius:0}
  .statusbar{display:none}
  .app-head{padding-top:max(14px,env(safe-area-inset-top));padding-right:84px}
  .banner{top:max(12px,env(safe-area-inset-top))}
  .demo-fab{display:block;position:fixed;top:max(14px,env(safe-area-inset-top));right:12px;z-index:60;border:0;background:rgba(31,26,23,.78);color:#fff;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px}
}
</style>
</head>
<body>

<header class="demobar" id="demobar">
  <div class="db-brand"><span class="logo">S</span><b>StampIt</b><span class="db-tag">Interactive demo</span></div>
  <div class="db-controls">
    <div class="seg" id="modeSeg">
      <button data-mode="both">Side by side</button>
      <button data-mode="owner">Store owner</button>
      <button data-mode="customer">Customer</button>
    </div>
    <label class="db-field" id="storeField">Store <select id="storeSel"></select></label>
    <label class="db-field" id="custField">Customer <select id="custSel"></select></label>
    <button class="db-btn" id="copyBtn">Copy link</button>
    <button class="db-btn ghost" id="resetBtn">Reset demo</button>
  </div>
</header>
<p class="hint" id="hint"></p>
<main class="stage" id="stage"></main>
<button class="demo-fab" id="fab">Demo ▾</button>

<script>
(() => {
const KEY = 'stampit-demo-v1';
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashStr = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

/* ---------- Icons ---------- */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.5 4"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M6 6V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8C10 4 6 4 6 6.5S9 8 12 8c3 0 6 .5 6-1.5S14 4 12 8"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',
};
const ic = (n, cls = '') => `<svg viewBox="0 0 24 24" class="ic ${cls}" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Data ---------- */
function seed(){
  const now = Date.now(), rnd = mulberry32(7);
  const stores = {
    cafe:{id:'cafe',name:'Bean & Bloom Café',emoji:'☕',color:'#9c5b2e',soft:'#f6ebe1',address:'214 Main St',cards:[
      {id:'c1',name:'Coffee Club',goal:10,reward:'Free drink of your choice',active:true},
      {id:'c2',name:'Pastry Pass',goal:6,reward:'Free pastry',active:true}]},
    barber:{id:'barber',name:'Sharp Lane Barbers',emoji:'💈',color:'#2f5d8a',soft:'#e4edf6',address:'88 King Ave',cards:[
      {id:'b1',name:'Cut Club',goal:6,reward:'Free haircut',active:true}]},
    bakery:{id:'bakery',name:'Golden Crust Bakery',emoji:'🥐',color:'#b0711a',soft:'#fbf0dc',address:'9 Harbour Rd',cards:[
      {id:'k1',name:'Bread Lovers',goal:8,reward:'Free loaf',active:true},
      {id:'k2',name:'Birthday Cake Card',goal:5,reward:'20% off a cake',active:false}]},
  };
  const customers = {};
  [['maya','Maya Chen','604-555-0142'],['jordan','Jordan Lee','604-555-0178'],['priya','Priya Patel','604-555-0119'],
   ['leo','Leo Martin','604-555-0163'],['sam','Sam Rivera','604-555-0107'],['aisha','Aisha Khan','604-555-0191'],
   ['noah','Noah Brooks','604-555-0135'],['emma','Emma Wilson','604-555-0126']]
   .forEach(([id,name,phone]) => customers[id] = {id,name,phone});
  const st = {v:1, stores, customers, members:[], activity:[], rewards:[]};
  // [store, customer, days since last visit, visits]
  const plan = [['cafe','maya',2,14],['cafe','jordan',5,9],['cafe','priya',1,22],['cafe','leo',27,6],['cafe','sam',34,4],
    ['cafe','aisha',3,11],['cafe','noah',12,5],['cafe','emma',45,3],
    ['barber','jordan',18,4],['barber','leo',9,5],['barber','noah',40,2],['barber','sam',25,3],['barber','maya',30,2],
    ['bakery','maya',6,8],['bakery','priya',4,12],['bakery','emma',2,7],['bakery','aisha',29,3],['bakery','noah',8,6]];
  plan.forEach(([store,cust,last,visits]) => {
    const cards = stores[store].cards.filter(c => c.active);
    const times = [now - last*DAY - rnd()*5*3600e3];
    for (let i = 1; i < visits; i++) times.push(now - (last + rnd()*(80-last))*DAY);
    times.sort((a,b) => a-b);
    const m = {store, cust, joined: times[0] - rnd()*3*DAY, stamps:{}};
    st.members.push(m);
    st.activity.push({id:uid('a'),store,cust,type:'join',ts:m.joined});
    times.forEach(ts => {
      const card = cards[rnd() < .75 ? 0 : cards.length-1];
      m.stamps[card.id] = (m.stamps[card.id]||0) + 1;
      st.activity.push({id:uid('a'),store,cust,card:card.id,type:'stamp',ts});
      if (m.stamps[card.id] >= card.goal) {
        m.stamps[card.id] = 0;
        const red = now-ts > 4*DAY && rnd() < .8 ? ts + rnd()*Math.min(10*DAY, now-ts) : null;
        const method = red ? (rnd() < .85 ? 'app' : 'staff') : null;
        st.rewards.push({id:uid('r'),store,cust,card:card.id,text:card.reward,earned:ts,redeemed:red,method,pending:null});
        st.activity.push({id:uid('a'),store,cust,card:card.id,type:'reward',ts:ts+1});
        if (red) st.activity.push({id:uid('a'),store,cust,card:card.id,type:'redeem',method,ts:red});
      }
    });
  });
  // Demo-friendly: Maya is two stamps away from a free drink.
  st.members.find(m => m.store==='cafe' && m.cust==='maya').stamps.c1 = 8;
  st.activity.sort((a,b) => a.ts-b.ts);
  return st;
}
function load(){ try { const o = JSON.parse(localStorage.getItem(KEY)); return o && o.v === 1 ? o : null; } catch(e) { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
let S = load() || seed();

const member = (store,cust) => S.members.find(m => m.store===store && m.cust===cust);
const membersOf = store => S.members.filter(m => m.store===store);
const storesOf = cust => S.members.filter(m => m.cust===cust).map(m => S.stores[m.store]).filter(Boolean);
const openRewards = (store,cust) => S.rewards.filter(r => r.store===store && r.cust===cust && !r.redeemed);
const REDEEM_MS = 10*60e3;
const pendingOf = store => S.rewards.filter(r => r.store===store && !r.redeemed && r.pending && r.pending.exp > Date.now());
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const countdown = r => `<span data-exp="${r.pending.exp}">${mmss(r.pending.exp - Date.now())}</span>`;
function lastVisit(store,cust){
  let t = 0; for (const a of S.activity) if (a.store===store && a.cust===cust && (a.type==='stamp'||a.type==='join') && a.ts>t) t = a.ts;
  return t;
}
const visitCount = (store,cust) => S.activity.filter(a => a.store===store && a.cust===cust && a.type==='stamp').length;
function ago(ts){
  const d = Math.floor((Date.now()-ts)/DAY);
  if (Date.now()-ts < 60e3) return 'just now';
  if (d < 1) return 'today'; if (d === 1) return 'yesterday';
  if (d < 14) return d + ' days ago'; return Math.floor(d/7) + ' weeks ago';
}
const monthYear = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',year:'numeric'});
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
const AVA = ['#e4572e','#2f5d8a','#2e7d4f','#8e44ad','#b0711a','#16808a','#c0392b','#5d6d7e'];
const avaColor = id => AVA[hashStr(id) % AVA.length];
const ava = c => `<span class="ava" style="background:${avaColor(c.id)}">${esc(initials(c.name))}</span>`;

function stats(id){
  const now = Date.now(), mem = membersOf(id);
  const stamps = S.activity.filter(a => a.store===id && a.type==='stamp');
  const per = {}; stamps.filter(a => now-a.ts < 60*DAY).forEach(a => per[a.cust] = (per[a.cust]||0)+1);
  const weeks = Array(8).fill(0);
  stamps.forEach(a => { const w = Math.floor((now-a.ts)/(7*DAY)); if (w < 8) weeks[7-w]++; });
  const atRisk = mem.map(m => ({c:S.customers[m.cust], last:lastVisit(id,m.cust)}))
    .filter(x => x.c && now-x.last > 21*DAY).sort((a,b) => a.last-b.last);
  const v60 = Object.values(per).reduce((a,b) => a+b, 0);
  return {
    members: mem.length,
    v30: stamps.filter(a => now-a.ts < 30*DAY).length,
    ret: mem.length ? Math.round(100*mem.filter(m => now-lastVisit(id,m.cust) < 30*DAY).length/mem.length) : 0,
    redeemed: S.rewards.filter(r => r.store===id && r.redeemed).length,
    perMember: mem.length ? (v60/mem.length).toFixed(1) : '0',
    weeks, atRisk,
  };
}

function tabbar(tabs, ui){

function sheetWrap(inner, ui){

  return `<div class="sheet-wrap${a}" data-act="close-bg"><div class="sheet${a}"><div class="grab"></div>${inner}</div></div>`;

const shHead = (title, sub, lead = '') =>
  `<div class="sh-head">${lead}<div class="grow"><h2>${title}</h2>${sub?`<div class="muted small">${sub}</div>`:''}</div><button class="x" data-act="close" aria-label="Close">${ic('x','sm')}</button></div>`;

function stampCard(store, card, count, opts = {}){
  const dots = Array.from({length:card.goal}, (_,i) => {
    const on = i < count, last = i === card.goal-1;
    const pop = opts.pop && i === count-1 ? ' pop' : '';
    return `<span class="dot${on?' on':''}${last&&!on?' goal':''}${pop}">${on ? store.emoji : last ? '🎁' : ''}</span>`;
  }).join('');
  const left = card.goal - count;
  const tag = opts.button ? 'button' : 'div';
  return `<${tag} class="scard${card.active?'':' paused'}" style="--c:${store.color}" ${opts.button?`data-act="qr" data-store="${store.id}"`:''}>
    <div class="sc-top"><span class="sc-emoji">${store.emoji}</span><div><div class="sc-store">${esc(store.name)}</div><div class="sc-name">${esc(card.name)}</div></div><span class="sc-count">${count}/${card.goal}</span></div>
    <div class="dots">${dots}</div>
    <div class="sc-foot">${left===card.goal ? `Collect ${card.goal} stamps` : `${left} more`} → <b>${esc(card.reward)}</b></div>
  </${tag}>`;
}

function qrSVG(seedStr){
  const N = 25, r = mulberry32(hashStr(seedStr)); let rects = '';
  const finder = (x,y,i,j) => { const dx=i-x, dy=j-y; if (dx<0||dy<0||dx>6||dy>6) return null;
    return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4); };
  for (let j=0;j<N;j++) for (let i=0;i<N;i++) {
    let f = finder(0,0,i,j); if (f===null) f = finder(N-7,0,i,j); if (f===null) f = finder(0,N-7,i,j);
    const near = (i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);
    const on = f!==null ? f : near ? false : r() < .5;
    if (on) rects += `<rect x="${i}" y="${j}" width="1.02" height="1.02"/>`;
  }
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" fill="#1f1a17">${rects}</svg>`;
}

function overlayOf(role){ return phones.find(p => p.role===role)?.el.querySelector('.overlay'); }

function banner(cust, store, title, text){

}

function confetti(role){

  const colors = ['#e4572e','#f2b134','#2e7d4f','#2f5d8a','#8e44ad','#fff3'];

    o.appendChild(c); setTimeout(() => c.remove(), 3200);

}
function filterList(input){

/* ---------- Actions ---------- */
const commit = () => { save(); renderAll(); };
const openSheet = (ui, sheet) => { ui.anim = !ui.sheet; ui.sheet = sheet; };
const digits = s => s.replace(/\D/g, '');

function addStamp(storeId, custId, cardId){
  const s = S.stores[storeId], m = member(storeId, custId), card = s.cards.find(k => k.id===cardId), c = S.customers[custId];
  if (!m || !card) return;
  const now = Date.now();
  m.stamps[cardId] = (m.stamps[cardId]||0) + 1;
  S.activity.push({id:uid('a'), store:storeId, cust:custId, card:cardId, type:'stamp', ts:now});
  if (m.stamps[cardId] >= card.goal) {
    m.stamps[cardId] = 0;
    S.rewards.push({id:uid('r'), store:storeId, cust:custId, card:cardId, text:card.reward, earned:now, redeemed:null});
    S.activity.push({id:uid('a'), store:storeId, cust:custId, card:cardId, type:'reward', ts:now+1});
    commit();
    toast('owner', `🎉 ${c.name.split(' ')[0]} unlocked: ${card.reward}`);
    banner(custId, s, `${s.name} · Reward unlocked! 🎉`, card.reward);
    confetti('customer'); if (!overlayOf('customer')) confetti('owner');
  } else {
    custUI.pop = storeId + '|' + cardId;
    commit();
    const n = m.stamps[cardId];
    toast('owner', `+1 stamp for ${c.name.split(' ')[0]} · ${n}/${card.goal}`);
    banner(custId, s, `${s.name} · +1 stamp`, `${n}/${card.goal} on ${card.name}. ${card.goal-n} more for ${card.reward.toLowerCase()}!`);
  }
}

$('#stage').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act==='close-bg' && e.target !== t) return;
  const phone = t.closest('.phone'); if (!phone) return;
  const role = phone.dataset.role, ui = role==='owner' ? ownerUI : custUI, d = t.dataset;
  const s = S.stores[view.store];
  switch (d.act) {
    case 'tab': ui.tab = d.tab; ui.sheet = null; renderAll(); break;
    case 'close': case 'close-bg': ui.sheet = null; renderAll(); break;
    // owner
    case 'cust': openSheet(ui, {type:'cust', cust:d.cust}); renderAll(); break;
    case 'cust-new': openSheet(ui, {type:'custForm', cust:null}); renderAll(); break;
    case 'cust-edit': ui.sheet = {type:'custForm', cust:d.cust}; renderAll(); break;
    case 'cust-del': ui.sheet = {type:'confirm', what:'cust', id:d.cust}; renderAll(); break;
    case 'card-new': openSheet(ui, {type:'cardForm', card:null}); renderAll(); break;
    case 'card-edit': openSheet(ui, {type:'cardForm', card:d.card}); renderAll(); break;
    case 'card-del': openSheet(ui, {type:'confirm', what:'card', id:d.card}); renderAll(); break;
    case 'confirm': {
      const sh = ui.sheet; ui.sheet = null;
      if (sh.what==='card') {
        const name = s.cards.find(k => k.id===sh.id)?.name;
        s.cards = s.cards.filter(k => k.id!==sh.id);
        membersOf(s.id).forEach(m => delete m.stamps[sh.id]);
        commit(); toast('owner', `Deleted “${name}”`);
      } else {
        const name = S.customers[sh.id]?.name;
        S.members = S.members.filter(m => !(m.store===s.id && m.cust===sh.id));
        S.activity = S.activity.filter(a => !(a.store===s.id && a.cust===sh.id));
        S.rewards = S.rewards.filter(r => !(r.store===s.id && r.cust===sh.id && !r.redeemed));
        commit(); toast('owner', `Removed ${name}`);
      }
      break;
    }
    case 'stamp': addStamp(s.id, ui.sheet.cust, d.card); break;
    // Path A, step 2: staff confirm a request the customer started in the app.
    case 'confirm-redeem': {
      const r = S.rewards.find(x => x.id===d.reward);
      if (!r || r.redeemed || !r.pending || r.pending.exp <= Date.now()) { toast('owner', 'This code has expired'); renderAll(); break; }
      r.redeemed = Date.now(); r.method = 'app'; r.pending = null;
      S.activity.push({id:uid('a'), store:r.store, cust:r.cust, card:r.card, type:'redeem', method:'app', ts:r.redeemed});
      if (view.cust === r.cust && custUI.sheet?.reward === r.id) custUI.sheet = {type:'used', reward:r.id};
      commit(); toast('owner', `✓ Redeemed: ${r.text}`);
      banner(r.cust, S.stores[r.store], S.stores[r.store].name, `Enjoy your ${r.text.toLowerCase()}! Thanks for coming back.`);
      if (view.cust === r.cust) confetti('customer');
      break;
    }
    // Path B: manual fallback when the customer has no phone.
    case 'manual-redeem': ui.sheet = {type:'manual', reward:d.reward}; renderAll(); break;
    case 'manual-confirm': {
      const r = S.rewards.find(x => x.id===d.reward); if (!r || r.redeemed) break;
      const c = S.customers[r.cust], st = S.stores[r.store];
      r.redeemed = Date.now(); r.method = 'staff'; r.pending = null;
      S.activity.push({id:uid('a'), store:r.store, cust:r.cust, card:r.card, type:'redeem', method:'staff', ts:r.redeemed});
      ui.sheet = {type:'cust', cust:r.cust};
      commit(); toast('owner', `Redeemed manually · ${c.name.split(' ')[0]} notified`);
      banner(r.cust, st, `${st.name} · Reward redeemed by staff`, `${r.text}. Not you? Tap “Not me?” in Rewards.`);
      break;
    }
    case 'nudge': {
      ownerUI.nudged[s.id+'|'+d.cust] = true; renderAll();
      toast('owner', `Offer sent to ${S.customers[d.cust].name.split(' ')[0]}`);
      banner(d.cust, s, `${s.name} misses you 👋`, `Come back this week for double stamps on your next visit.`);
      break;
    }
    // customer
    case 'qr': openSheet(ui, {type:'qr', store:d.store, reward:d.reward||null}); renderAll(); break;
    // Path A, step 1: customer chooses to use a reward and gets a short-lived code.
    case 'reward-open': {
      const r = S.rewards.find(x => x.id===d.reward); if (!r) break;
      openSheet(ui, {type: r.pending && r.pending.exp > Date.now() ? 'useCode' : 'useConfirm', reward:r.id}); renderAll(); break;
    }
    case 'use-confirm': {
      const r = S.rewards.find(x => x.id===d.reward); if (!r || r.redeemed) break;
      r.pending = {code:String(Math.floor(100000 + Math.random()*900000)), exp:Date.now() + REDEEM_MS};
      S.activity.push({id:uid('a'), store:r.store, cust:r.cust, card:r.card, type:'request', ts:Date.now()});
      ui.sheet = {type:'useCode', reward:r.id};
      commit();
      ownerBanner(S.stores[r.store], `Redeem request · ${S.customers[r.cust].name}`, `${r.text}. Code ${r.pending.code}`);
      break;
    }
    case 'use-cancel': {
      const r = S.rewards.find(x => x.id===d.reward); if (r) r.pending = null;
      ui.sheet = null; commit(); toast('customer', 'Request cancelled. Your reward is still available.');
      break;
    }
    case 'report': {
      const r = S.rewards.find(x => x.id===d.reward); if (!r) break;
      r.reported = true;
      S.activity.push({id:uid('a'), store:r.store, cust:r.cust, card:r.card, type:'report', ts:Date.now()});
      commit(); toast('customer', `Reported to ${S.stores[r.store].name}. They’ll follow up.`);
      ownerBanner(S.stores[r.store], `⚠️ ${S.customers[r.cust].name} reported a redemption`, `“${r.text}” was redeemed by staff without the app.`);
      break;
    }
    case 'join': {
      S.members.push({store:d.store, cust:view.cust, joined:Date.now(), stamps:{}});
      S.activity.push({id:uid('a'), store:d.store, cust:view.cust, type:'join', ts:Date.now()});
      commit(); toast('customer', `Joined ${S.stores[d.store].name}`);
      break;
    }
    case 'leave': openSheet(ui, {type:'leave', store:d.store}); renderAll(); break;
    case 'leave-confirm': {
      const st = ui.sheet.store; ui.sheet = null;
      S.members = S.members.filter(m => !(m.store===st && m.cust===view.cust));
      S.rewards = S.rewards.filter(r => !(r.store===st && r.cust===view.cust && !r.redeemed));
      if (ownerUI.sheet?.cust === view.cust && view.store === st) ownerUI.sheet = null;
      commit(); toast('customer', `Left ${S.stores[st].name}`);
      break;
    }
  }
});

$('#stage').addEventListener('submit', e => {

  const f = e.target, fd = new FormData(f), s = S.stores[view.store], sh = ownerUI.sheet;

      ownerUI.sheet = {type:'cust', cust:sh.cust}; commit(); toast('owner', 'Saved');
    } else {

      const existed = !!c;
      if (!c) { c = {id:uid('u'), name, phone}; S.customers[c.id] = c; }
      if (!member(s.id, c.id)) {
        S.members.push({store:s.id, cust:c.id, joined:Date.now(), stamps:{}});
        S.activity.push({id:uid('a'), store:s.id, cust:c.id, type:'join', ts:Date.now()});
      }
      ownerUI.sheet = {type:'cust', cust:c.id}; commit();
      toast('owner', existed ? `${c.name} already uses StampIt. Added to your store` : `Added ${c.name}`);
      banner(c.id, s, `Welcome to ${s.name}!`, 'Your new stamp card is in your wallet.');
    }
  }
  if (f.dataset.form==='card') {
    const data = {name:fd.get('name').trim(), goal:+fd.get('goal'), reward:fd.get('reward').trim(), active:fd.get('active')==='on'};
    if (!data.name || !data.reward) return;
    if (sh.card) Object.assign(s.cards.find(k => k.id===sh.card), data);
    else s.cards.push({id:uid('k'), ...data});
    ownerUI.sheet = null; commit(); toast('owner', sh.card ? 'Card updated' : `Created “${data.name}”`);
  }
});
$('#stage').addEventListener('input', e => { if (e.target.matches('[data-search]')) filterList(e.target); });

/* ---------- Demo bar ---------- */
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view.mode = b.dataset.mode; buildStage(); });
$('#storeSel').addEventListener('change', e => { view.store = e.target.value; ownerUI.sheet = null; renderAll(); });
$('#custSel').addEventListener('change', e => { view.cust = e.target.value; custUI.sheet = null; renderAll(); });
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('Reset the demo back to its sample data?')) return;
  S = seed(); save(); ownerUI.sheet = custUI.sheet = null; ownerUI.nudged = {}; renderAll();
});
$('#copyBtn').addEventListener('click', async () => {
  const b = $('#copyBtn');
  try { await navigator.clipboard.writeText(location.href); b.textContent = 'Copied ✓'; }
  catch(e) { prompt('Copy this link:', location.href); }
  setTimeout(() => b.textContent = 'Copy link', 1500);
});
$('#fab').addEventListener('click', () => $('#demobar').classList.toggle('open'));
document.addEventListener('click', e => {
  if (mq.matches && !e.target.closest('#demobar,#fab')) $('#demobar').classList.remove('open');
});
addEventListener('hashchange', () => { readHash(); buildStage(); });
mq.addEventListener('change', buildStage);
addEventListener('storage', e => { if (e.key===KEY) { S = load() || seed(); renderAll(); } });

// Countdown for redeem codes; expired requests fall back to "available".
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-exp]').forEach(el => el.textContent = mmss(+el.dataset.exp - now));
  const expired = S.rewards.filter(r => !r.redeemed && r.pending && r.pending.exp <= now);
  if (!expired.length) return;
  expired.forEach(r => r.pending = null);
  if (expired.some(r => r.cust===view.cust && custUI.sheet?.reward===r.id)) {
    custUI.sheet = null; commit(); toast('customer', 'Code expired. Your reward is still available.');
  } else commit();
}, 1000);

readHash();
buildStage();
})();
</script>
</body>
</html>
